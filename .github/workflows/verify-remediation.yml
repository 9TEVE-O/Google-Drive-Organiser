name: Verify remediation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Start production server
        run: |
          npm start > /tmp/drive-organiser.log 2>&1 &
          echo $! > /tmp/drive-organiser.pid

      - name: Verify server health
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/drive-organiser.log
          exit 1

      - name: Verify frozen Voice removal structurally
        run: |
          ! grep -R --line-number --exclude-dir=node_modules --exclude-dir=dist -E 'VoiceConversation|/api/live|requestFramePermissions.*microphone|createScriptProcessor|WebSocketServer' .

      - name: Verify seven retained tabs are present
        run: |
          for tab in drive organizer backup tasks reports image_gen chat; do
            grep -q "setActiveTab(\"$tab\")" src/App.tsx src/components/Header.tsx || {
              echo "Missing retained tab: $tab"
              exit 1
            }
          done
