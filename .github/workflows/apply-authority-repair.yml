name: Apply authority repair

on:
  push:
    branches: [remediation/minimal-safe-build]
    paths:
      - .github/workflows/apply-authority-repair.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: remediation/minimal-safe-build
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun for lockfile parity
        uses: oven-sh/setup-bun@v2

      - name: Apply bounded authority repair
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          helper = Path("src/lib/geminiApi.ts")
          if helper.exists():
              raise SystemExit("src/lib/geminiApi.ts already exists; refusing to re-apply repair")

          helper.write_text('''import { auth } from "./googleApi";\n\nasync function sendAuthenticatedRequest(\n  input: RequestInfo | URL,\n  init: RequestInit,\n  forceRefresh: boolean\n): Promise<Response> {\n  const user = auth.currentUser;\n  if (!user) {\n    throw new Error("Sign in is required before using Gemini features.");\n  }\n\n  const idToken = await user.getIdToken(forceRefresh);\n  const headers = new Headers(init.headers || {});\n  headers.set("Authorization", `Bearer ${idToken}`);\n\n  return fetch(input, {\n    ...init,\n    headers\n  });\n}\n\n/**\n * Authenticated transport for server-backed Gemini capability.\n * A 401 receives one forced Firebase token refresh before the response is returned.\n */\nexport async function geminiFetch(\n  input: RequestInfo | URL,\n  init: RequestInit = {}\n): Promise<Response> {\n  let response = await sendAuthenticatedRequest(input, init, false);\n  if (response.status === 401) {\n    response = await sendAuthenticatedRequest(input, init, true);\n  }\n  return response;\n}\n''')

          consumers = [
              "src/components/SmartOrganizer.tsx",
              "src/components/FilePreviewModal.tsx",
              "src/components/TaskManager.tsx",
              "src/components/ImageGenerator.tsx",
              "src/components/GeminiChatbot.tsx",
          ]
          total_replacements = 0
          for path in consumers:
              p = Path(path)
              text = p.read_text()
              if 'import { geminiFetch } from "../lib/geminiApi";' in text:
                  raise SystemExit(f"{path}: authenticated import already present")
              text = 'import { geminiFetch } from "../lib/geminiApi";\n' + text
              count = text.count('fetch("/api/gemini/')
              if count == 0:
                  raise SystemExit(f"{path}: no Gemini fetch call found")
              total_replacements += count
              text = text.replace('fetch("/api/gemini/', 'geminiFetch("/api/gemini/')
              p.write_text(text)

          if total_replacements != 7:
              raise SystemExit(f"Expected 7 Gemini fetch replacements, found {total_replacements}")

          server = Path("server.ts")
          text = server.read_text()
          import_anchor = 'import { GoogleGenAI, Type } from "@google/genai";\n'
          if text.count(import_anchor) != 1:
              raise SystemExit("server.ts: GoogleGenAI import anchor mismatch")
          text = text.replace(import_anchor, import_anchor + '''import { applicationDefault, getApps, initializeApp as initializeAdminApp } from "firebase-admin/app";\nimport { getAuth as getAdminAuth } from "firebase-admin/auth";\nimport firebaseConfig from "./firebase-applet-config.json";\n''', 1)

          app_anchor = 'const app = express();\n'
          if text.count(app_anchor) != 1:
              raise SystemExit("server.ts: express app anchor mismatch")
          text = text.replace(app_anchor, app_anchor + '''\nconst firebaseProjectId = process.env.FIREBASE_PROJECT_ID || firebaseConfig.projectId;\nif (!firebaseProjectId) {\n  throw new Error("Firebase project ID is required for server-side ID token verification.");\n}\n\nif (getApps().length === 0) {\n  initializeAdminApp({\n    credential: applicationDefault(),\n    projectId: firebaseProjectId\n  });\n}\n\nconst firebaseAdminAuth = getAdminAuth();\n''', 1)

          auth_anchor = 'app.use("/api/gemini", apiRateLimiter);\n'
          if text.count(auth_anchor) != 1:
              raise SystemExit("server.ts: Gemini middleware anchor mismatch")
          auth_block = '''async function requireFirebaseAuth(\n  req: express.Request,\n  res: express.Response,\n  next: express.NextFunction\n) {\n  const authorization = req.get("authorization");\n  if (!authorization || !authorization.startsWith("Bearer ")) {\n    return res.status(401).json({ error: "Firebase authentication is required." });\n  }\n\n  const idToken = authorization.slice("Bearer ".length).trim();\n  if (!idToken) {\n    return res.status(401).json({ error: "Firebase authentication is required." });\n  }\n\n  try {\n    const decodedToken = await firebaseAdminAuth.verifyIdToken(idToken);\n    res.locals.firebaseUser = {\n      uid: decodedToken.uid,\n      email: decodedToken.email ?? null\n    };\n    next();\n  } catch (error: any) {\n    console.warn("[Firebase Auth] Rejected ID token:", error?.message || "verification failed");\n    return res.status(401).json({ error: "Firebase authentication is required." });\n  }\n}\n\n// All retained Gemini routes are server-funded content/analysis capabilities.\n// Workspace mutation remains client-side under the user's Google OAuth grant.\n// Any future server route with external side effects requires an additional route-specific authorization gate.\napp.use("/api/gemini", apiRateLimiter, requireFirebaseAuth);\n'''
          text = text.replace(auth_anchor, auth_block, 1)
          server.write_text(text)

          env = Path(".env.example")
          env_text = env.read_text()
          if "FIREBASE_PROJECT_ID" not in env_text:
              env_text += '''\n# FIREBASE_PROJECT_ID: Project whose Firebase ID tokens the server accepts.\n# Production Firebase Admin verification also requires Application Default Credentials\n# (for example, the Cloud Run service account).\nFIREBASE_PROJECT_ID="gen-lang-client-0910713313"\n'''
              env.write_text(env_text)

          agents = Path("AGENTS.md")
          agents_text = agents.read_text()
          marker = '3. **Rate Limiting & Payload Bounds**: Express must enforce `express.json({ limit: "2mb" })` and the sliding-window rate limiter on `/api/gemini`.\n'
          if marker not in agents_text:
              raise SystemExit("AGENTS.md security marker not found")
          replacement = marker + '''4. **Authenticated Gemini Boundary**: Every `/api/gemini/*` request must present a Firebase ID token and the Express server must verify it before any server-held Gemini credential is exercised. Client Google OAuth access tokens are not substitutes for Firebase application identity.\n5. **Voice Removal Freeze**: Real-time Voice UI, microphone permission, the live WebSocket server route, and direct `ws` / `@types/ws` dependencies remain removed. Do not reintroduce them without a new authorised requirement and threat review.\n'''
          agents.write_text(agents_text.replace(marker, replacement, 1))

          PY

      - name: Install Firebase Admin and refresh npm lockfile
        run: npm install firebase-admin --save

      - name: Refresh Bun lockfile
        run: bun install --lockfile-only

      - name: Type-check repaired build
        run: npm run lint

      - name: Build repaired production bundle
        run: npm run build

      - name: Verify diff hygiene
        run: |
          git diff --check
          ! grep -R --line-number --exclude-dir=node_modules --exclude-dir=dist 'fetch("/api/gemini/' src

      - name: Commit bounded repair
        run: |
          git config user.name "9TEVE-O"
          git config user.email "145073848+9TEVE-O@users.noreply.github.com"
          git add .env.example AGENTS.md package.json package-lock.json bun.lock server.ts src
          git commit -m "fix(security): bind Gemini routes to Firebase identity"
          git push origin HEAD:remediation/minimal-safe-build
